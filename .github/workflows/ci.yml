name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.config

      - name: Restore
        run: dotnet restore VibeTorrent.slnx

      - name: Build
        run: dotnet build VibeTorrent.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test tests\VibeTorrent.Tests\VibeTorrent.Tests.csproj -c Release --no-build --nologo
