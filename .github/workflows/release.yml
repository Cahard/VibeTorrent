name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VibeTorrent.slnx

      - name: Test
        run: dotnet test tests\VibeTorrent.Tests\VibeTorrent.Tests.csproj -c Release --nologo

      - name: Publish framework-dependent build
        run: >
          dotnet publish src\VibeTorrent.App\VibeTorrent.App.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=false
          -p:DebugType=None
          -o dist-fx
          --nologo

      - name: Publish self-contained single-file build
        run: >
          dotnet publish src\VibeTorrent.App\VibeTorrent.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o dist-sc
          --nologo

      - name: Create release archives and checksums
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $fx = "VibeTorrent-$tag-win-x64.zip"
          $sc = "VibeTorrent-$tag-win-x64-selfcontained.zip"
          Compress-Archive -Path dist-fx\* -DestinationPath $fx -CompressionLevel Optimal
          Compress-Archive -Path dist-sc\* -DestinationPath $sc -CompressionLevel Optimal
          foreach ($file in @($fx, $sc)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content "$file.sha256" -Encoding ascii
            Get-Item -LiteralPath @($file, "$file.sha256") | Select-Object Name, Length
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "VibeTorrent-$tag-win-x64.zip",
            "VibeTorrent-$tag-win-x64.zip.sha256",
            "VibeTorrent-$tag-win-x64-selfcontained.zip",
            "VibeTorrent-$tag-win-x64-selfcontained.zip.sha256"
          )
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "VibeTorrent $tag — native Windows 11 torrent client" `
            --generate-notes `
            --latest
