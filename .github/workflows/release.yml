name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Restore and test
        run: |
          dotnet restore ZTorrent.slnx
          dotnet test tests\ZTorrent.Tests\ZTorrent.Tests.csproj -c Release --nologo

      - name: Publish self-contained build
        run: >
          dotnet publish src\ZTorrent.App\ZTorrent.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o dist-sc
          --nologo

      - name: Build portable archive and installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $portable = "ZTorrent-Portable.zip"
          New-Item -ItemType Directory -Force dist-portable | Out-Null
          Copy-Item -Path dist-sc\* -Destination dist-portable -Recurse -Force
          Copy-Item README.md, README.ru.md, README.ko.md, LICENSE, THIRD-PARTY-NOTICES.md -Destination dist-portable
          Compress-Archive -Path dist-portable\* -DestinationPath $portable -CompressionLevel Optimal

          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*", "C:\Program Files\Inno Setup*" `
            -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) was not found" }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist-sc" "/DOutputDir=$PWD\artifacts\installer" "$PWD\installer\ZTorrent.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Copy-Item "artifacts\installer\ZTorrent-Setup-$version.exe" "ZTorrent-Setup.exe"

          foreach ($file in @("ZTorrent-Setup.exe", $portable)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content "$file.sha256" -Encoding ascii
            Get-Item -LiteralPath @($file, "$file.sha256") | Select-Object Name, Length
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            "ZTorrent-Setup.exe" `
            "ZTorrent-Setup.exe.sha256" `
            "ZTorrent-Portable.zip" `
            "ZTorrent-Portable.zip.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --title "ZTorrent $tag — Windows 11 torrent client" `
            --generate-notes `
            --latest
