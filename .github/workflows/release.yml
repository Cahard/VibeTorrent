name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VibeTorrent.slnx

      - name: Test
        run: dotnet test tests\VibeTorrent.Tests\VibeTorrent.Tests.csproj -c Release --nologo

      - name: Publish self-contained single-file app
        run: >
          dotnet publish src\VibeTorrent.App\VibeTorrent.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o dist
          --nologo

      - name: Create release archive
        shell: pwsh
        run: |
          $asset = "VibeTorrent-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $asset -CompressionLevel Optimal
          Get-Item $asset | Select-Object Name, Length

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "VibeTorrent-$tag-win-x64.zip"
          gh release create $tag $asset `
            --repo $env:GITHUB_REPOSITORY `
            --title "VibeTorrent $tag" `
            --generate-notes `
            --latest
